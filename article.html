<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#001759">
  <title>Article | KDH Advocates LLP</title>
  <link rel="icon" type="image/png" sizes="256x256" href="assets/kdh-favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .article-hero { width: 100%; height: 50vh; min-height: 400px; object-fit: cover; display: block; margin-bottom: -4rem; } .article-container { max-width: 800px; margin: 0 auto; padding: 8rem 5% 4rem; position: relative; z-index: 2; background: white; border-radius: 12px 12px 0 0; }
    .article-header { margin-bottom: 3rem; text-align: center; }
    .article-header h1 { font-family: 'Playfair Display', serif; font-size: 2.5rem; color: #001759; margin-bottom: 1rem; }
    .article-meta { color: #666; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.85rem; }
    .article-content { font-size: 1.1rem; line-height: 1.8; color: #222; }
    .article-content h2 { font-family: 'Playfair Display', serif; color: #001759; margin-top: 2rem; margin-bottom: 1rem; }
    .article-content p { margin-bottom: 1.5rem; }
    .article-content ul, .article-content ol { margin-bottom: 1.5rem; padding-left: 2rem; } .article-content img { max-width: 100%; height: auto; border-radius: 8px; margin: 2rem 0; } .article-content iframe.ql-video { width: 100%; height: 450px; border: none; margin: 2rem 0; }
    .back-link { display: inline-block; margin-top: 3rem; font-weight: 600; color: #d4af37; text-decoration: none; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="brand brand-logo" href="/" aria-label="KDH Advocates home">
      <img src="assets/kdh-law-logo-transparent.png" alt="KDH Advocates LLP">
    </a>
    <nav id="nav">
      <a href="/insights">All Insights</a>
    </nav>
  </header>

  <main id="main">
    <div id="article-hero-container"></div><article class="article-container" id="article-container">
      <div style="text-align:center; padding: 4rem;">Loading article...</div>
    </article>
  </main>

  <footer>
    <div class="footer-bottom">
      <small>&copy; 2026 KDH Advocates LLP. All rights reserved.</small>
      <p>Trust. Integrity. Results.</p>
    </div>
  </footer>

  <script>
    function setMeta(name, content) {
      let meta = document.querySelector(`meta[name="${name}"]`);
      if (!meta) {
        meta = document.createElement("meta");
        meta.name = name;
        document.head.appendChild(meta);
      }
      meta.content = content;
    }

    function setProperty(property, content) {
      let meta = document.querySelector(`meta[property="${property}"]`);
      if (!meta) {
        meta = document.createElement("meta");
        meta.setAttribute("property", property);
        document.head.appendChild(meta);
      }
      meta.content = content;
    }

    function setCanonical(url) {
      let link = document.querySelector('link[rel="canonical"]');
      if (!link) {
        link = document.createElement('link');
        link.rel = 'canonical';
        document.head.appendChild(link);
      }
      link.href = url;
    }

    function safeArticleFragment(html) {
      const template = document.createElement('template');
      template.innerHTML = String(html || '');
      template.content.querySelectorAll('script,style,object,embed,form,input,button,meta,link,base,svg,math').forEach((node) => node.remove());
      template.content.querySelectorAll('*').forEach((node) => {
        [...node.attributes].forEach((attribute) => {
          const name = attribute.name.toLowerCase();
          const value = attribute.value.trim();
          if (name.startsWith('on')) node.removeAttribute(attribute.name);
          if ((name === 'href' || name === 'src') && /^(javascript|vbscript):/i.test(value)) node.removeAttribute(attribute.name);
          if (name === 'href' && /^data:/i.test(value)) node.removeAttribute(attribute.name);
        });
        if (node.tagName === 'A' && node.getAttribute('target') === '_blank') node.setAttribute('rel', 'noopener noreferrer');
        if (node.tagName === 'IFRAME') {
          const src = node.getAttribute('src') || '';
          const allowed = /^https:\/\/(www\.)?(youtube\.com\/embed\/|player\.vimeo\.com\/video\/)/i.test(src);
          if (!allowed) node.remove();
          else node.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-presentation');
        }
      });
      return template.content;
    }

    async function loadArticle() {
      const slug = new URLSearchParams(window.location.search).get("slug");
      const container = document.getElementById("article-container");
      if (!slug) {
        container.innerHTML = "<h2>Article not found</h2>";
        return;
      }

      try {
        const res = await fetch("/api/public?route=posts");
        if (!res.ok) throw new Error("Unable to load posts");
        const posts = await res.json();
        const post = posts.find((item) => item.slug === slug);
        if (!post) throw new Error("Not found");

        const seoTitle = post.seoTitle || post.title;
        const seoDescription = post.seoDescription || post.summary || '';
        const canonical = `https://www.kdhadvocates.com/article?slug=${encodeURIComponent(post.slug)}`;
        document.title = `${seoTitle} | KDH Advocates LLP`;
        if (seoDescription) setMeta("description", seoDescription);
        setProperty('og:title', seoTitle);
        if (seoDescription) setProperty('og:description', seoDescription);
        setProperty('og:type', 'article');
        setProperty('og:url', canonical);
        if (post.coverImage) setProperty('og:image', post.coverImage);
        setMeta('twitter:card', post.coverImage ? 'summary_large_image' : 'summary');
        setMeta('twitter:title', seoTitle);
        if (seoDescription) setMeta('twitter:description', seoDescription);
        if (post.coverImage) setMeta('twitter:image', post.coverImage);
        setCanonical(canonical);

        if (post.coverImage) {
          const hero = document.createElement("img");
          hero.src = post.coverImage;
          hero.className = "article-hero";
          hero.alt = post.title || "KDH Advocates article";
          document.getElementById("article-hero-container").replaceChildren(hero);
        }

        container.replaceChildren();
        const header = document.createElement("header");
        header.className = "article-header";
        const meta = document.createElement("div");
        meta.className = "article-meta";
        meta.textContent = new Date(post.date || post.scheduledAt || Date.now()).toLocaleDateString("en-GB", { year: "numeric", month: "long", day: "numeric" });
        const title = document.createElement("h1");
        title.textContent = post.title || "Insight";
        header.append(meta, title);

        const content = document.createElement("div");
        content.className = "article-content";
        // Rich article HTML is sanitized again in the browser before insertion.
        content.replaceChildren(safeArticleFragment(post.content || ""));

        const back = document.createElement("a");
        back.href = "/insights";
        back.className = "back-link";
        back.textContent = "← Back to all insights";
        container.append(header, content, back);
      } catch {
        container.innerHTML = "<h2>Unable to load article.</h2>";
      }
    }
    loadArticle();
  </script>
</body>
</html>
