<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Insights, news, and articles from KDH Advocates LLP.">
  <meta name="theme-color" content="#001759">
  <title>Insights | KDH Advocates LLP</title>
  <link rel="icon" type="image/png" sizes="256x256" href="assets/kdh-favicon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .insights-grid { display: grid; gap: 2rem; padding: 4rem 5%; max-width: 1200px; margin: 0 auto; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
    .insight-card { border: 1px solid #ddd; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; } .insight-card-body { padding: 2rem; display: flex; flex-direction: column; gap: 1rem; flex-grow: 1; } .insight-card-img { width: 100%; height: 200px; object-fit: cover; }
    .insight-card h3 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: #001759; }
    .insight-card p { flex-grow: 1; }
    .insight-card a { font-weight: 600; color: #d4af37; text-decoration: none; }
    .insight-card a:hover { text-decoration: underline; }
  </style>
  <meta name="robots" content="index,follow">
  <meta property="og:title" content="Insights | KDH Advocates LLP">
  <meta property="og:description" content="Insights, news, and articles from KDH Advocates LLP.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.kdhadvocates.com/insights">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="https://www.kdhadvocates.com/insights">
</head>
<body>
  <header class="site-header">
    <a class="brand brand-logo" href="/" aria-label="KDH Advocates home">
      <img src="assets/kdh-law-logo-transparent.png" alt="KDH Advocates LLP">
    </a>
    <nav id="nav">
      <a href="/">Home</a>
    </nav>
  </header>

  <main id="main">
    <section class="section" style="padding-top: 8rem; text-align: center;">
      <h1 style="font-family: 'Playfair Display', serif; font-size: 3rem; color: #001759;">Insights & News</h1>
      <p style="max-width: 600px; margin: 1rem auto; font-size: 1.1rem;">Expert legal analysis, firm news, and commercial updates from our team.</p>
    </section>

    <div class="insights-grid" id="insights-grid">
      <p>Loading insights...</p>
    </div>
  </main>

  <footer>
    <div class="footer-bottom">
      <small>&copy; 2026 KDH Advocates LLP. All rights reserved.</small>
      <p>Trust. Integrity. Results.</p>
    </div>
  </footer>

  <script>
    async function loadInsights() {
      const grid = document.getElementById("insights-grid");
      try {
        const res = await fetch("/api/public?route=posts");
        if (!res.ok) throw new Error("Unable to load posts");
        const posts = await res.json();
        grid.replaceChildren();
        if (!posts.length) {
          const empty = document.createElement("p");
          empty.textContent = "No insights published yet.";
          grid.appendChild(empty);
          return;
        }

        posts.forEach((post) => {
          const article = document.createElement("article");
          article.className = "insight-card";
          if (post.coverImage) {
            const image = document.createElement("img");
            image.src = post.coverImage;
            image.className = "insight-card-img";
            image.alt = post.title || "KDH Advocates article";
            article.appendChild(image);
          }
          const body = document.createElement("div");
          body.className = "insight-card-body";
          const date = document.createElement("small");
          date.textContent = new Date(post.date || post.scheduledAt || Date.now()).toLocaleDateString();
          const title = document.createElement("h3");
          title.textContent = post.title || "Insight";
          const summary = document.createElement("p");
          summary.textContent = post.summary || "";
          const link = document.createElement("a");
          link.href = `/article?slug=${encodeURIComponent(post.slug)}`;
          link.textContent = "Read article →";
          body.append(date, title, summary, link);
          article.appendChild(body);
          grid.appendChild(article);
        });
      } catch {
        grid.textContent = "Unable to load insights.";
      }
    }
    loadInsights();
  </script>
</body>
</html>
